<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <div class="app-title">Rock Paper Scissors</div>
        <div class="weapon-box">
            <h3>Select your Weapon</h3>
            <div class="weapons">
                <div class="Rock">
                    <img src="RoPaSci Images/Rock.png" alt="">
                </div>
                <div class="Paper">
                    <img src="RoPaSci Images/Paper.png" alt="">
                </div>
                <div class="Scissors">
                    <img src="RoPaSci Images/Scissors.png" alt="">
                </div>
            </div>
        </div>
        <div class="player-choices">
            <h3>Player <span>v/s</span> Computer</h3>
            <div class="player-choice">
                <img src="RoPaSci Images/Rock.png" alt="">
            </div>
            <div class="computer-choice">
                <img src="RoPaSci Images/Rock.png" alt="">
            </div>
        </div>
        <div class="score-box">
            <div class="won">
                <h3>Won: <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost: <span>0</span></h3>
            </div>
            <div class="draw">
                <h3>Draw: <span>0</span></h3>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
